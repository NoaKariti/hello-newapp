name: build-k8s-deployer

on:
  workflow_dispatch:

env:
  APP_NAME: k8s-deployer
  DOCKER_REPO: elevy99927

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          APP_IMAGE="${DOCKER_REPO}/${APP_NAME}"

          TOKEN="$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${APP_IMAGE}:pull" | jq -r .token)"

          DIGEST="$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/${APP_IMAGE}/manifests/latest" \
            | jq -r '.config.digest // empty')"

          if [ -z "${DIGEST}" ]; then
            VERSION="1"
          else
            CURRENT="$(curl -s \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.docker.container.image.v1+json" \
              "https://registry-1.docker.io/v2/${APP_IMAGE}/blobs/${DIGEST}" \
              | jq -r '.config.Labels.VERSION // empty')"

            if [ -z "${CURRENT}" ]; then
              VERSION="1"
            else
              VERSION="$((CURRENT + 1))"
            fi
          fi

          echo "Next VERSION: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.DOCKER_REPO }}/${{ env.APP_NAME }}:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/${{ env.APP_NAME }}:latest
