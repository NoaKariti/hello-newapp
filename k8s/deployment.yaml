apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-newapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-newapp
  template:
    metadata:
      labels:
        app: hello-newapp
    spec:
      containers:
      - name: hello-newapp
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-newapp
  namespace: default
spec:
  selector:
    app: hello-newapp
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
